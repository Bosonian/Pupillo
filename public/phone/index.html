<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pupillo — Scan Medicine</title>
  <!-- ZXing barcode reader library — supports 1D, 2D, DataMatrix, QR, EAN, Code128 -->
  <script src="https://unpkg.com/@AmbiqAI/zxing-browser@0.1.6/dist/zxing-browser.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: white; min-height: 100vh; display: flex; flex-direction: column; }
    .header { padding: 1rem; text-align: center; }
    .header h1 { font-size: 1.2rem; }
    .header .status { font-size: 0.85rem; color: #aaa; margin-top: 0.3rem; }
    .header .status.ok { color: #28a745; }
    .camera-container { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: black; }
    #video { width: 100%; height: 100%; object-fit: cover; }
    .scan-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 260px; height: 160px; border: 2px solid rgba(255,255,255,0.6); border-radius: 12px; pointer-events: none; }
    .scan-overlay.scanned { border-color: #28a745; box-shadow: 0 0 20px rgba(40,167,69,0.5); }
    .last-scan { padding: 1rem; background: #16213e; text-align: center; min-height: 80px; display: flex; flex-direction: column; justify-content: center; }
    .last-scan .name { font-size: 1.1rem; font-weight: 600; }
    .last-scan .barcode { font-family: monospace; font-size: 0.8rem; color: #aaa; margin-top: 0.3rem; }
    .last-scan .info { font-size: 0.85rem; color: #ccc; margin-top: 0.3rem; }
    .scan-count { position: absolute; top: 1rem; right: 1rem; background: rgba(0,0,0,0.6); padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.85rem; }
    .error { color: #ff6b6b; padding: 2rem; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Pupillo Scanner</h1>
    <div class="status" id="status">Connecting...</div>
  </div>

  <div class="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <div class="scan-overlay" id="overlay"></div>
    <div class="scan-count" id="scanCount">0 scans</div>
  </div>

  <div class="last-scan" id="lastScan">
    <div class="info">Point camera at a medicine barcode</div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const lastScanEl = document.getElementById('lastScan');
    const overlayEl = document.getElementById('overlay');
    const scanCountEl = document.getElementById('scanCount');
    const videoEl = document.getElementById('video');

    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session');
    let ws;
    let scanCount = 0;
    let lastBarcode = '';
    let lastScanTime = 0;
    const DEBOUNCE_MS = 2000; // Prevent duplicate scans within 2 seconds

    if (!sessionId) {
      document.body.innerHTML = '<div class="error"><h2>No session ID</h2><p>Please scan the QR code shown on the desktop to connect.</p></div>';
    } else {
      connectWebSocket();
      startScanner();
    }

    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}?session=${sessionId}&role=phone`);

      ws.onopen = () => {
        statusEl.textContent = 'Connected to desktop';
        statusEl.classList.add('ok');
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'scan-result') {
          showScanResult(msg);
        }
      };

      ws.onclose = () => {
        statusEl.textContent = 'Disconnected — reloading...';
        statusEl.classList.remove('ok');
        setTimeout(() => window.location.reload(), 3000);
      };
    }

    async function startScanner() {
      try {
        // Use ZXing multi-format reader for broad barcode support
        const codeReader = new ZXingBrowser.BrowserMultiFormatReader();

        // Get rear camera
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        // Prefer rear/environment camera
        const rearCamera = videoDevices.find(d =>
          d.label.toLowerCase().includes('back') ||
          d.label.toLowerCase().includes('rear') ||
          d.label.toLowerCase().includes('environment')
        );
        const deviceId = rearCamera ? rearCamera.deviceId : undefined;

        const constraints = {
          video: {
            deviceId: deviceId ? { exact: deviceId } : undefined,
            facingMode: deviceId ? undefined : { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        videoEl.srcObject = stream;

        // Continuous decode from video
        codeReader.decodeFromVideoDevice(
          deviceId || undefined,
          'video',
          (result, err) => {
            if (result) {
              handleScan(result.getText(), result.getBarcodeFormat());
            }
          }
        );
      } catch (err) {
        document.body.innerHTML = `<div class="error">
          <h2>Camera access required</h2>
          <p>${err.message}</p>
          <p style="margin-top:1rem">Please allow camera access and reload.</p>
        </div>`;
      }
    }

    function handleScan(barcode, format) {
      const now = Date.now();
      // Debounce: ignore same barcode within 2 seconds
      if (barcode === lastBarcode && (now - lastScanTime) < DEBOUNCE_MS) {
        return;
      }
      lastBarcode = barcode;
      lastScanTime = now;
      scanCount++;
      scanCountEl.textContent = `${scanCount} scan${scanCount !== 1 ? 's' : ''}`;

      // Flash overlay green
      overlayEl.classList.add('scanned');
      setTimeout(() => overlayEl.classList.remove('scanned'), 500);

      // Vibrate if supported
      if (navigator.vibrate) navigator.vibrate(100);

      // Send to server via WebSocket
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'scan',
          barcode: barcode,
          format: formatName(format)
        }));
      }
    }

    function showScanResult(msg) {
      const m = msg.medicine;
      if (m && m.found) {
        lastScanEl.innerHTML = `
          <div class="name">${m.name || 'Medicine Data Found'}</div>
          <div class="barcode">${msg.barcode}</div>
          <div class="info">${[m.manufacturer, m.strength, m.form].filter(Boolean).join(' — ') || 'Sent to desktop'}</div>
        `;
      } else {
        lastScanEl.innerHTML = `
          <div class="name">Barcode Scanned</div>
          <div class="barcode">${msg.barcode}</div>
          <div class="info">Sent to desktop</div>
        `;
      }
    }

    function formatName(format) {
      const names = {
        0: 'Aztec', 1: 'Codabar', 2: 'Code 39', 3: 'Code 93',
        4: 'Code 128', 5: 'Data Matrix', 6: 'EAN-8', 7: 'EAN-13',
        8: 'ITF', 9: 'MaxiCode', 10: 'PDF417', 11: 'QR Code',
        12: 'RSS-14', 13: 'RSS Expanded', 14: 'UPC-A', 15: 'UPC-E', 16: 'UPC/EAN'
      };
      return names[format] || `Format ${format}`;
    }
  </script>
</body>
</html>
