<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Pupillo — Scan Medicine</title>
  <!-- zxing-wasm: C++ zxing compiled to WASM — handles large Data Matrix ECC 200 -->
  <script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.0.2/dist/iife/reader/index.js"
    onerror="document.body.innerHTML='<div style=\'color:#ff6b6b;padding:2rem;text-align:center\'><h2>Failed to load scanner</h2><p>Check network and reload.</p></div>'"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: white; min-height: 100vh; display: flex; flex-direction: column; }
    .header { padding: 0.8rem 1rem; text-align: center; }
    .header h1 { font-size: 1.2rem; }
    .header .status { font-size: 0.85rem; color: #aaa; margin-top: 0.2rem; }
    .header .status.ok { color: #28a745; }
    .camera-container { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: black; }
    #video { width: 100%; height: 100%; object-fit: cover; }
    .scan-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 280px; height: 280px;
      border: 2px solid rgba(255,255,255,0.5); border-radius: 12px;
      pointer-events: none; transition: all 0.2s;
    }
    .scan-overlay.scanned { border-color: #28a745; box-shadow: 0 0 30px rgba(40,167,69,0.6); }
    .scan-overlay.processing { border-color: #ffc107; box-shadow: 0 0 20px rgba(255,193,7,0.4); animation: pulse 1s infinite; }
    .scan-overlay.partial { border-color: #17a2b8; box-shadow: 0 0 15px rgba(23,162,184,0.4); }
    .scan-overlay .corners { position: absolute; inset: -2px; }
    .scan-overlay .corner { position: absolute; width: 20px; height: 20px; border: 3px solid white; }
    .scan-overlay .corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
    .scan-overlay .corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
    .scan-overlay .corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 0 8px; }
    .scan-overlay .corner.br { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 8px 0; }
    .guidance { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; padding: 0.8rem; background: linear-gradient(transparent, rgba(0,0,0,0.8)); font-size: 0.9rem; color: #ddd; }
    .guidance.warn { color: #ffc107; }
    .guidance.info { color: #17a2b8; }
    .scan-count { position: absolute; top: 0.8rem; right: 0.8rem; background: rgba(0,0,0,0.6); padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.85rem; }
    .mode-indicator { position: absolute; top: 0.8rem; left: 0.8rem; background: rgba(0,0,0,0.6); padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.75rem; }
    .mode-indicator.server { background: rgba(255,193,7,0.3); color: #ffc107; }
    .last-scan { padding: 1rem; background: #16213e; text-align: center; min-height: 70px; display: flex; flex-direction: column; justify-content: center; }
    .last-scan .name { font-size: 1.1rem; font-weight: 600; }
    .last-scan .barcode { font-family: monospace; font-size: 0.8rem; color: #aaa; margin-top: 0.2rem; }
    .last-scan .info { font-size: 0.85rem; color: #ccc; margin-top: 0.2rem; }
    .error { color: #ff6b6b; padding: 2rem; text-align: center; }
    .capture-btn { position: absolute; bottom: 4.5rem; left: 50%; transform: translateX(-50%); background: rgba(0,123,255,0.7); border: 2px solid rgba(255,255,255,0.5); color: white; padding: 0.9rem 2rem; border-radius: 30px; font-size: 1rem; font-weight: 600; cursor: pointer; backdrop-filter: blur(10px); letter-spacing: 0.5px; }
    .capture-btn:active { background: rgba(0,123,255,0.9); transform: translateX(-50%) scale(0.96); }
    .capture-btn.processing { opacity: 0.5; pointer-events: none; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
    canvas { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Pupillo Scanner</h1>
    <div class="status" id="status">Loading WASM...</div>
  </div>

  <div class="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <div class="scan-overlay" id="overlay">
      <div class="corners">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
      </div>
    </div>
    <div class="scan-count" id="scanCount">0 scans</div>
    <div class="mode-indicator" id="modeIndicator">Live scan</div>
    <div class="guidance" id="guidance">Initializing scanner...</div>
    <button class="capture-btn" id="captureBtn">FOTO AUFNEHMEN &amp; ERKENNEN</button>
  </div>

  <div class="last-scan" id="lastScan">
    <div class="info">Point camera at a medicine barcode</div>
  </div>

  <canvas id="captureCanvas"></canvas>

  <script>
    // ═══════════════════════════════════════════════════════════════
    // UTILITIES
    // ═══════════════════════════════════════════════════════════════
    function esc(str) {
      if (typeof str !== 'string') return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ═══════════════════════════════════════════════════════════════
    // CONFIGURATION
    // ═══════════════════════════════════════════════════════════════
    const SCAN_INTERVAL_MS = 250;           // ~4 FPS decode rate
    const DEBOUNCE_MS = 2000;
    const SERVER_DECODE_INTERVAL = 4000;
    const FAILED_FRAMES_BEFORE_SERVER = 12;
    const FOCUS_CYCLE_MS = 4000;
    const MAX_RECONNECT_ATTEMPTS = 10;

    // ═══════════════════════════════════════════════════════════════
    // DOM
    // ═══════════════════════════════════════════════════════════════
    const statusEl = document.getElementById('status');
    const lastScanEl = document.getElementById('lastScan');
    const overlayEl = document.getElementById('overlay');
    const scanCountEl = document.getElementById('scanCount');
    const modeEl = document.getElementById('modeIndicator');
    const guidanceEl = document.getElementById('guidance');
    const captureBtn = document.getElementById('captureBtn');
    const videoEl = document.getElementById('video');
    const captureCanvas = document.getElementById('captureCanvas');

    // ═══════════════════════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════════════════════
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session');
    const sessionToken = params.get('token');
    let ws;
    let scanCount = 0;
    let lastBarcode = '';
    let lastScanTime = 0;
    let failedFrameCount = 0;
    let isServerDecoding = false;
    let isScanning = false;
    let stream = null;
    let imageCapture = null;
    let reconnectAttempts = 0;
    let focusIntervalId = null;
    let failureMonitorId = null;
    let scanLoopId = null;

    // zxing-wasm reader options — optimized for large Data Matrix (BMP)
    const readerOptions = {
      formats: ['DataMatrix', 'QRCode', 'EAN13', 'EAN8', 'Code128', 'Code39',
                'UPCA', 'UPCE', 'PDF417', 'Aztec', 'Codabar', 'ITF',
                'DataBar', 'DataBarExp'],
      tryHarder: true,
      tryRotate: true,
      tryInvert: true,
      tryDownscale: true,
      maxNumberOfSymbols: 4,
    };

    // More aggressive options for high-res still capture
    const hiResReaderOptions = {
      formats: ['DataMatrix'],  // Focus only on Data Matrix for BMP
      tryHarder: true,
      tryRotate: true,
      tryInvert: true,
      tryDownscale: true,
      tryDenoise: true,
      maxNumberOfSymbols: 1,
    };

    if (!sessionId || !sessionToken) {
      document.body.innerHTML = '<div class="error"><h2>No session</h2><p>Scan the QR code on your desktop screen.</p></div>';
    } else {
      init();
    }

    async function init() {
      // Initialize zxing-wasm (loads WASM binary from jsdelivr CDN)
      try {
        statusEl.textContent = 'Loading scanner engine...';
        // Prepare the WASM module (will be loaded on first readBarcodes call)
        ZXingWASM.prepareZXingModule();
        statusEl.textContent = 'Scanner ready';
      } catch (err) {
        document.body.innerHTML = `<div class="error"><h2>Scanner init failed</h2><p>${esc(err.message)}</p></div>`;
        return;
      }

      connectWebSocket();
      await startCamera();
      startScanLoop();
      startFailureMonitor();
      captureBtn.addEventListener('click', () => captureAndDecode());
    }

    // ═══════════════════════════════════════════════════════════════
    // CAMERA
    // ═══════════════════════════════════════════════════════════════
    async function startCamera() {
      try {
        // Request highest resolution available — large Data Matrix needs
        // enough pixels per module (each module ~0.5mm at 300dpi print)
        const constraints = {
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 3840 },
            height: { ideal: 2160 },
          }
        };

        stream = await navigator.mediaDevices.getUserMedia(constraints);
        videoEl.srcObject = stream;
        await videoEl.play();

        const track = stream.getVideoTracks()[0];
        const capabilities = track.getCapabilities ? track.getCapabilities() : {};

        if (typeof ImageCapture !== 'undefined') {
          imageCapture = new ImageCapture(track);
        }

        if (track.applyConstraints) {
          try {
            const adv = {};
            if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) adv.focusMode = 'continuous';
            if (capabilities.exposureMode) adv.exposureMode = 'continuous';
            if (Object.keys(adv).length > 0) await track.applyConstraints({ advanced: [adv] });
          } catch (e) { /* unsupported */ }
        }

        if (focusIntervalId) clearInterval(focusIntervalId);
        focusIntervalId = setInterval(() => cycleFocus(track, capabilities), FOCUS_CYCLE_MS);

        setGuidance('Position the barcode inside the frame');
      } catch (err) {
        document.body.innerHTML = `<div class="error">
          <h2>Camera access needed</h2>
          <p>${esc(err.message)}</p>
          <p style="margin-top:1rem">Allow camera access, then reload.</p>
        </div>`;
      }
    }

    async function cycleFocus(track, capabilities) {
      if (!capabilities.focusMode || !capabilities.focusMode.includes('continuous')) return;
      try {
        if (capabilities.focusMode.includes('manual')) {
          await track.applyConstraints({ advanced: [{ focusMode: 'manual' }] });
          await new Promise(r => setTimeout(r, 200));
        }
        await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
      } catch (e) { /* ignore */ }
    }

    // ═══════════════════════════════════════════════════════════════
    // SCAN LOOP — captures video frames and decodes with zxing-wasm
    // ═══════════════════════════════════════════════════════════════
    function startScanLoop() {
      if (scanLoopId) clearInterval(scanLoopId);

      scanLoopId = setInterval(async () => {
        if (isScanning || isServerDecoding) return;
        if (!videoEl.videoWidth) return;
        isScanning = true;

        try {
          // Capture frame from video to canvas → ImageData
          const w = videoEl.videoWidth;
          const h = videoEl.videoHeight;
          captureCanvas.width = w;
          captureCanvas.height = h;
          const ctx = captureCanvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(videoEl, 0, 0, w, h);
          const imageData = ctx.getImageData(0, 0, w, h);

          // Decode with zxing-wasm
          const results = await ZXingWASM.readBarcodes(imageData, readerOptions);

          if (results.length > 0) {
            processResults(results);
          } else {
            failedFrameCount++;
          }
        } catch (err) {
          // WASM decode error — skip frame
          failedFrameCount++;
        } finally {
          isScanning = false;
        }
      }, SCAN_INTERVAL_MS);
    }

    // ═══════════════════════════════════════════════════════════════
    // RESULT PROCESSING
    // BMP is a SINGLE large Data Matrix ECC 200 symbol (not structured
    // append). The internal grid pattern is data region subdivision
    // per ISO/IEC 16022, not separate symbols.
    // ═══════════════════════════════════════════════════════════════
    function processResults(results) {
      for (const result of results) {
        if (!result.isValid) continue;

        failedFrameCount = 0;
        // Use raw bytes for binary content (BMP = "MP" + zlib)
        const barcode = bytesToLatin1(result.bytes);
        handleScan(barcode, result.format, 'live');
      }
    }

    /**
     * Convert raw bytes to a Latin-1 string (preserves byte values 0-255).
     * This is how binary Data Matrix content (like BMP's "MP" + zlib)
     * gets transmitted as a string through WebSocket to the server,
     * where Buffer.from(str, 'latin1') recovers the exact bytes.
     */
    function bytesToLatin1(bytes) {
      let str = '';
      for (let i = 0; i < bytes.length; i++) {
        str += String.fromCharCode(bytes[i]);
      }
      return str;
    }

    // ═══════════════════════════════════════════════════════════════
    // CAPTURE & DECODE — Two-stage pipeline:
    // Stage 1: High-res client-side decode (ImageCapture API → zxing-wasm)
    // Stage 2: Server-side preprocessing if client fails
    //
    // For large Data Matrix (BMP ~100+ modules), high-res stills
    // are essential — live video frames rarely have enough resolution.
    // ═══════════════════════════════════════════════════════════════
    async function captureAndDecode() {
      if (isServerDecoding) return;
      isServerDecoding = true;

      overlayEl.classList.add('processing');
      modeEl.textContent = 'Capturing...';
      modeEl.classList.add('server');
      captureBtn.classList.add('processing');
      if (navigator.vibrate) navigator.vibrate(50);

      try {
        // === Stage 1: Client-side high-res decode ===
        setGuidance('Capturing high-res photo...');

        const { blob, dataUrl } = await captureHighResFrame();
        if (!blob && !dataUrl) {
          setGuidance('Capture failed — try again', true);
          return;
        }

        // Try decoding the raw high-res capture directly
        setGuidance('Decoding...');
        try {
          const input = blob || await (await fetch(dataUrl)).blob();
          const results = await ZXingWASM.readBarcodes(input, hiResReaderOptions);
          if (results.length > 0 && results[0].isValid) {
            const r = results[0];
            handleScan(bytesToLatin1(r.bytes), r.format, 'hires-capture');
            setGuidance('Decoded from high-res capture');
            return;
          }
        } catch { /* client decode failed, continue to server */ }

        // === Stage 2: Server-side preprocessing + client decode ===
        setGuidance('Enhancing image on server...');

        const imageData = dataUrl || await blobToDataUrl(blob);
        const response = await fetch('/api/decode-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: imageData })
        });

        if (!response.ok) throw new Error('Server error');
        const { quality, variants } = await response.json();

        if (quality.sharpness < 20) {
          setGuidance('Image blurry — hold steadier, try again', true);
        }

        // Try each server-preprocessed variant
        for (const variant of variants) {
          try {
            const resp = await fetch(variant.dataUrl);
            const variantBlob = await resp.blob();
            const results = await ZXingWASM.readBarcodes(variantBlob, hiResReaderOptions);

            if (results.length > 0 && results[0].isValid) {
              const r = results[0];
              handleScan(bytesToLatin1(r.bytes), r.format, `server:${variant.name}`);
              setGuidance(`Decoded (${variant.name})`);
              return;
            }
          } catch { /* try next */ }
        }

        setGuidance('Not decoded — try: closer, flat, good light', true);
      } catch (err) {
        console.error('Capture decode error:', err);
        setGuidance('Error — try again', true);
      } finally {
        isServerDecoding = false;
        overlayEl.classList.remove('processing');
        modeEl.textContent = 'Live scan';
        modeEl.classList.remove('server');
        captureBtn.classList.remove('processing');
      }
    }

    /**
     * Capture highest resolution still frame possible.
     * Returns { blob, dataUrl } — one or both may be set.
     */
    async function captureHighResFrame() {
      // Method 1: ImageCapture API — takes a real photo at full sensor resolution
      if (imageCapture) {
        try {
          const blob = await imageCapture.takePhoto({
            imageWidth: 4032,   // Request maximum resolution
            imageHeight: 3024,
          });
          return { blob, dataUrl: null };
        } catch (e) { /* fall through to canvas */ }
      }

      // Method 2: Canvas grab from video (lower res but always works)
      if (!videoEl.videoWidth) return { blob: null, dataUrl: null };
      captureCanvas.width = videoEl.videoWidth;
      captureCanvas.height = videoEl.videoHeight;
      captureCanvas.getContext('2d').drawImage(videoEl, 0, 0);
      return { blob: null, dataUrl: captureCanvas.toDataURL('image/jpeg', 0.95) };
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    // ═══════════════════════════════════════════════════════════════
    // FAILURE MONITOR — escalates to server-side decode
    // ═══════════════════════════════════════════════════════════════
    function startFailureMonitor() {
      if (failureMonitorId) clearInterval(failureMonitorId);
      failureMonitorId = setInterval(async () => {
        if (failedFrameCount < FAILED_FRAMES_BEFORE_SERVER) return;
        if (isServerDecoding) return;

        failedFrameCount = 0;
        await captureAndDecode();
      }, SERVER_DECODE_INTERVAL);
    }

    // ═══════════════════════════════════════════════════════════════
    // WEBSOCKET + SCAN HANDLING
    // ═══════════════════════════════════════════════════════════════
    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}?session=${sessionId}&role=phone&token=${sessionToken}`);

      ws.onopen = () => {
        statusEl.textContent = 'Connected to desktop';
        statusEl.classList.add('ok');
        reconnectAttempts = 0;
      };

      ws.onmessage = (event) => {
        let msg;
        try { msg = JSON.parse(event.data); } catch { return; }
        if (msg.type === 'scan-result') showScanResult(msg);
      };

      ws.onclose = (event) => {
        statusEl.classList.remove('ok');
        if (event.code === 4001 || event.code === 4002) {
          statusEl.textContent = 'Session expired — scan the QR code again';
          return;
        }
        if (event.code === 4005) {
          statusEl.textContent = 'Too many phones connected to this session';
          return;
        }
        if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
          reconnectAttempts++;
          const delay = Math.min(2000 * reconnectAttempts, 15000);
          statusEl.textContent = `Reconnecting (${reconnectAttempts})...`;
          setTimeout(() => connectWebSocket(), delay);
        } else {
          statusEl.textContent = 'Disconnected — scan QR code again';
        }
      };
    }

    function handleScan(barcode, format, method) {
      const now = Date.now();
      if (barcode === lastBarcode && (now - lastScanTime) < DEBOUNCE_MS) return;

      lastBarcode = barcode;
      lastScanTime = now;
      scanCount++;
      scanCountEl.textContent = `${scanCount} scan${scanCount !== 1 ? 's' : ''}`;
      failedFrameCount = 0;

      overlayEl.classList.add('scanned');
      setTimeout(() => overlayEl.classList.remove('scanned'), 600);
      if (navigator.vibrate) navigator.vibrate(100);
      setGuidance(`Decoded (${method})`);

      try {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'scan', barcode, format: String(format), method }));
        }
      } catch (e) { /* connection closing */ }
    }

    function showScanResult(msg) {
      const m = msg.medicine;
      if (m && m.found) {
        const nameText = m.type === 'bmp'
          ? (m.name || 'Medikationsplan erkannt')
          : (m.name || 'Medicine Data Found');
        lastScanEl.innerHTML = `
          <div class="name">${esc(nameText)}</div>
          <div class="info">${esc(
            m.type === 'bmp'
              ? `${m.sections ? m.sections.reduce((n,s) => n + (s.medications||[]).length, 0) : 0} Medikamente`
              : [m.manufacturer, m.strength, m.form].filter(Boolean).join(' — ') || 'Sent to desktop'
          )}</div>
        `;
      } else {
        lastScanEl.innerHTML = `
          <div class="name">Barcode Scanned</div>
          <div class="barcode">${esc(msg.barcode.length > 60 ? msg.barcode.slice(0,60) + '...' : msg.barcode)}</div>
          <div class="info">Sent to desktop</div>
        `;
      }
    }

    function setGuidance(text, isWarn = false, isInfo = false) {
      guidanceEl.textContent = text;
      guidanceEl.classList.toggle('warn', isWarn);
      guidanceEl.classList.toggle('info', isInfo);
    }
  </script>
</body>
</html>
