<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Pupillo — Desktop Medicine Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #1a1a2e; min-height: 100vh; }
    .header { background: #1a1a2e; color: white; padding: 1.5rem 2rem; display: flex; align-items: center; gap: 1rem; }
    .header h1 { font-size: 1.5rem; font-weight: 600; }
    .header .status { margin-left: auto; font-size: 0.9rem; padding: 0.4rem 1rem; border-radius: 20px; background: #333; }
    .header .status.connected { background: #28a745; }
    .container { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; display: grid; grid-template-columns: 300px 1fr; gap: 2rem; }
    .pairing-panel { background: white; border-radius: 12px; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; height: fit-content; }
    .pairing-panel h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #555; }
    .pairing-panel p { font-size: 0.85rem; color: #888; margin-top: 1rem; }
    #qrCanvas { max-width: 250px; width: 100%; }
    .results-panel { display: flex; flex-direction: column; gap: 1rem; }
    .results-panel h2 { font-size: 1.2rem; color: #555; }
    .scan-card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); animation: slideIn 0.3s ease; }
    .scan-card.not-found { border-left: 4px solid #ffc107; }
    .scan-card.found { border-left: 4px solid #28a745; }
    .scan-card .time { font-size: 0.8rem; color: #999; margin-bottom: 0.5rem; }
    .scan-card .medicine-name { font-size: 1.3rem; font-weight: 600; color: #1a1a2e; }
    .scan-card .barcode-raw { font-family: monospace; font-size: 0.85rem; color: #888; margin: 0.3rem 0; }
    .scan-card .details { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.5rem; margin-top: 0.8rem; }
    .scan-card .detail { background: #f5f7fa; padding: 0.5rem 0.8rem; border-radius: 6px; }
    .scan-card .detail label { font-size: 0.7rem; text-transform: uppercase; color: #999; display: block; }
    .scan-card .detail span { font-size: 0.95rem; font-weight: 500; }
    .empty-state { text-align: center; padding: 4rem 2rem; color: #999; }
    .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="header">
    <h1>Pupillo</h1>
    <span>Medicine Barcode Scanner</span>
    <div class="status" id="status">Initializing...</div>
  </div>

  <div class="container">
    <div class="pairing-panel">
      <h2>Scan with your phone</h2>
      <canvas id="qrCanvas"></canvas>
      <p id="pairingInfo">Point your phone camera at this QR code to start scanning medicine barcodes</p>
    </div>

    <div class="results-panel">
      <h2>Scanned Medicines</h2>
      <div id="results">
        <div class="empty-state">
          <div class="icon">&#x1F4F7;</div>
          <p>Waiting for scans from your phone...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // HTML escape to prevent XSS from barcode/medicine content
    function esc(str) {
      if (typeof str !== 'string') return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    let ws;
    let isFirstScan = true;
    let sessionId = null;
    let sessionToken = null;
    let reconnectAttempts = 0;
    const MAX_RECONNECT_ATTEMPTS = 10;

    async function init() {
      // Create a session
      const res = await fetch('/api/session', { method: 'POST' });
      const data = await res.json();
      sessionId = data.sessionId;
      sessionToken = data.token;

      // Generate the phone URL (includes token for auth)
      const host = window.location.host;
      const protocol = window.location.protocol;
      const phoneUrl = `${protocol}//${host}/phone/?session=${sessionId}&token=${sessionToken}`;

      // Render QR code
      QRCode.toCanvas(document.getElementById('qrCanvas'), phoneUrl, {
        width: 250,
        margin: 2,
        color: { dark: '#1a1a2e', light: '#ffffff' }
      });

      connectWebSocket();
    }

    function connectWebSocket() {
      const host = window.location.host;
      const protocol = window.location.protocol;
      const wsProtocol = protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${wsProtocol}//${host}?session=${sessionId}&role=desktop&token=${sessionToken}`);

      ws.onopen = () => {
        statusEl.textContent = 'Waiting for phone...';
        reconnectAttempts = 0;
      };

      ws.onmessage = (event) => {
        let msg;
        try { msg = JSON.parse(event.data); } catch { return; }

        if (msg.type === 'phone-connected') {
          statusEl.textContent = `Phone connected (${msg.count})`;
          statusEl.classList.add('connected');
        } else if (msg.type === 'phone-disconnected') {
          if (msg.count === 0) {
            statusEl.textContent = 'Phone disconnected';
            statusEl.classList.remove('connected');
          } else {
            statusEl.textContent = `Phone connected (${msg.count})`;
          }
        } else if (msg.type === 'scan-result') {
          addScanResult(msg);
        } else if (msg.type === 'status') {
          statusEl.textContent = msg.message;
        }
      };

      ws.onclose = (event) => {
        statusEl.classList.remove('connected');

        // Session expired or auth failed — don't reconnect
        if (event.code === 4001 || event.code === 4002) {
          statusEl.textContent = 'Session expired — refresh page';
          return;
        }
        // We were replaced by another desktop tab
        if (event.code === 4004) {
          statusEl.textContent = 'Replaced by another desktop tab — refresh to reclaim';
          return;
        }

        if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
          reconnectAttempts++;
          const delay = Math.min(2000 * reconnectAttempts, 15000);
          statusEl.textContent = `Reconnecting (${reconnectAttempts})...`;
          setTimeout(() => connectWebSocket(), delay);
        } else {
          statusEl.textContent = 'Disconnected — refresh to reconnect';
        }
      };
    }

    function addScanResult(msg) {
      if (isFirstScan) {
        resultsEl.innerHTML = '';
        isFirstScan = false;
      }

      const card = document.createElement('div');
      const found = msg.medicine && msg.medicine.found;
      card.className = `scan-card ${found ? 'found' : 'not-found'}`;

      const time = new Date(msg.timestamp).toLocaleTimeString();

      let detailsHtml = '';
      if (found) {
        const m = msg.medicine;
        const fields = [
          m.manufacturer && ['Manufacturer', m.manufacturer],
          m.ndc && ['NDC', m.ndc],
          m.form && ['Form', m.form],
          m.strength && ['Strength', m.strength],
          m.gtin && ['GTIN', m.gtin],
          m.expiry && ['Expiry', m.expiry],
          m.lot && ['Lot', m.lot],
          m.serial && ['Serial', m.serial],
        ].filter(Boolean);

        detailsHtml = `<div class="details">${fields.map(([label, value]) =>
          `<div class="detail"><label>${esc(label)}</label><span>${esc(String(value))}</span></div>`
        ).join('')}</div>`;
      }

      card.innerHTML = `
        <div class="time">${esc(time)} &middot; ${esc(msg.format || 'unknown format')}</div>
        <div class="medicine-name">${found ? esc(msg.medicine.name || 'GS1 Medicine Data') : 'Unknown Barcode'}</div>
        <div class="barcode-raw">${esc(msg.barcode)}</div>
        ${detailsHtml}
        ${!found ? `<p style="color:#888;font-size:0.85rem;margin-top:0.5rem">${esc(msg.medicine.message || '')}</p>` : ''}
      `;

      resultsEl.prepend(card);
    }

    init();
  </script>
</body>
</html>
