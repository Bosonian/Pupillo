<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Pupillo — Desktop Medicine Scanner</title>
  <!-- QR code is generated server-side, no external JS needed -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #1a1a2e; min-height: 100vh; }
    .header { background: #1a1a2e; color: white; padding: 1.5rem 2rem; display: flex; align-items: center; gap: 1rem; }
    .header h1 { font-size: 1.5rem; font-weight: 600; }
    .header .status { margin-left: auto; font-size: 0.9rem; padding: 0.4rem 1rem; border-radius: 20px; background: #333; }
    .header .status.connected { background: #28a745; }
    .container { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; display: grid; grid-template-columns: 300px 1fr; gap: 2rem; }
    .pairing-panel { background: white; border-radius: 12px; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; height: fit-content; }
    .pairing-panel h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #555; }
    .pairing-panel p { font-size: 0.85rem; color: #888; margin-top: 1rem; }
    #qrCanvas { max-width: 250px; width: 100%; }
    .results-panel { display: flex; flex-direction: column; gap: 1rem; }
    .results-panel h2 { font-size: 1.2rem; color: #555; }
    .scan-card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); animation: slideIn 0.3s ease; }
    .scan-card.not-found { border-left: 4px solid #ffc107; }
    .scan-card.found { border-left: 4px solid #28a745; }
    .scan-card .time { font-size: 0.8rem; color: #999; margin-bottom: 0.5rem; }
    .scan-card .medicine-name { font-size: 1.3rem; font-weight: 600; color: #1a1a2e; }
    .scan-card .barcode-raw { font-family: monospace; font-size: 0.85rem; color: #888; margin: 0.3rem 0; }
    .scan-card .details { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.5rem; margin-top: 0.8rem; }
    .scan-card .detail { background: #f5f7fa; padding: 0.5rem 0.8rem; border-radius: 6px; }
    .scan-card .detail label { font-size: 0.7rem; text-transform: uppercase; color: #999; display: block; }
    .scan-card .detail span { font-size: 0.95rem; font-weight: 500; }
    .empty-state { text-align: center; padding: 4rem 2rem; color: #999; }
    .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
    /* BMP Medication Plan styles */
    .scan-card.bmp { border-left: 4px solid #007bff; }
    .scan-card.bmp .medicine-name { color: #007bff; }
    .bmp-patient { background: #e8f4fd; padding: 0.8rem; border-radius: 8px; margin: 0.5rem 0; }
    .bmp-patient .label { font-size: 0.7rem; text-transform: uppercase; color: #666; }
    .bmp-patient .value { font-weight: 500; }
    .bmp-section { margin-top: 0.8rem; }
    .bmp-section-title { font-size: 0.85rem; font-weight: 600; color: #555; padding: 0.3rem 0; border-bottom: 1px solid #eee; margin-bottom: 0.4rem; }
    .bmp-med { display: grid; grid-template-columns: 1fr auto; gap: 0.5rem; padding: 0.5rem 0; border-bottom: 1px solid #f0f0f0; }
    .bmp-med:last-child { border-bottom: none; }
    .bmp-med-name { font-weight: 500; font-size: 0.95rem; }
    .bmp-med-form { font-size: 0.8rem; color: #888; }
    .bmp-med-reason { font-size: 0.8rem; color: #007bff; font-style: italic; }
    .bmp-dosage { display: flex; gap: 0.3rem; align-items: center; }
    .bmp-dose { background: #f5f7fa; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem; text-align: center; min-width: 2rem; }
    .bmp-dose.active { background: #007bff; color: white; }
    .bmp-dose-label { font-size: 0.6rem; color: #999; display: block; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="header">
    <h1>Pupillo</h1>
    <span>Medicine Barcode Scanner</span>
    <div class="status" id="status">Initializing...</div>
  </div>

  <div class="container">
    <div class="pairing-panel">
      <h2>Scan with your phone</h2>
      <img id="qrImage" alt="QR Code" style="max-width:250px;width:100%" />
      <p id="pairingInfo">Point your phone camera at this QR code to start scanning medicine barcodes</p>
    </div>

    <div class="results-panel">
      <h2>Scanned Medicines</h2>
      <div id="results">
        <div class="empty-state">
          <div class="icon">&#x1F4F7;</div>
          <p>Waiting for scans from your phone...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // HTML escape to prevent XSS from barcode/medicine content
    function esc(str) {
      if (typeof str !== 'string') return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    let ws;
    let isFirstScan = true;
    let sessionId = null;
    let sessionToken = null;
    let reconnectAttempts = 0;
    const MAX_RECONNECT_ATTEMPTS = 10;

    async function init() {
      try {
      // Create a session
      const res = await fetch('/api/session', { method: 'POST' });
      const data = await res.json();
      sessionId = data.sessionId;
      sessionToken = data.token;

      // Show QR code (generated server-side — no external JS needed)
      const qrImg = document.getElementById('qrImage');
      qrImg.src = `/api/qr/${sessionId}/${sessionToken}`;
      qrImg.onerror = () => {
        document.getElementById('pairingInfo').textContent = 'QR generation failed. Reload to try again.';
      };

      const host = window.location.host;
      const protocol = window.location.protocol;
      const phoneUrl = `${protocol}//${host}/phone/?session=${sessionId}&token=${sessionToken}`;
      document.getElementById('pairingInfo').innerHTML =
        'Scan with phone camera or open:<br><small style="color:#aaa;word-break:break-all">' + esc(phoneUrl) + '</small>';

      connectWebSocket();
      } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
        document.getElementById('pairingInfo').textContent = 'Failed to create session. Check console for details.';
        console.error('Init error:', err);
      }
    }

    function connectWebSocket() {
      const host = window.location.host;
      const protocol = window.location.protocol;
      const wsProtocol = protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${wsProtocol}//${host}?session=${sessionId}&role=desktop&token=${sessionToken}`);

      ws.onopen = () => {
        statusEl.textContent = 'Waiting for phone...';
        reconnectAttempts = 0;
      };

      ws.onmessage = (event) => {
        let msg;
        try { msg = JSON.parse(event.data); } catch { return; }

        if (msg.type === 'phone-connected') {
          statusEl.textContent = `Phone connected (${msg.count})`;
          statusEl.classList.add('connected');
        } else if (msg.type === 'phone-disconnected') {
          if (msg.count === 0) {
            statusEl.textContent = 'Phone disconnected';
            statusEl.classList.remove('connected');
          } else {
            statusEl.textContent = `Phone connected (${msg.count})`;
          }
        } else if (msg.type === 'scan-result') {
          addScanResult(msg);
        } else if (msg.type === 'status') {
          statusEl.textContent = msg.message;
        }
      };

      ws.onclose = (event) => {
        statusEl.classList.remove('connected');

        // Session expired or auth failed — don't reconnect
        if (event.code === 4001 || event.code === 4002) {
          statusEl.textContent = 'Session expired — refresh page';
          return;
        }
        // We were replaced by another desktop tab
        if (event.code === 4004) {
          statusEl.textContent = 'Replaced by another desktop tab — refresh to reclaim';
          return;
        }

        if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
          reconnectAttempts++;
          const delay = Math.min(2000 * reconnectAttempts, 15000);
          statusEl.textContent = `Reconnecting (${reconnectAttempts})...`;
          setTimeout(() => connectWebSocket(), delay);
        } else {
          statusEl.textContent = 'Disconnected — refresh to reconnect';
        }
      };
    }

    function addScanResult(msg) {
      if (isFirstScan) {
        resultsEl.innerHTML = '';
        isFirstScan = false;
      }

      const m = msg.medicine;
      const found = m && m.found;
      const time = new Date(msg.timestamp).toLocaleTimeString();

      // BMP Medication Plan — dedicated rich render
      if (m && m.type === 'bmp') {
        const card = document.createElement('div');
        card.className = 'scan-card bmp';

        let html = `<div class="time">${esc(time)} &middot; BMP Medikationsplan &middot; v${esc(m.bmpVersion || '?')}</div>`;
        html += `<div class="medicine-name">${esc(m.name || 'Medikationsplan')}</div>`;

        // Patient info
        if (m.patient && Object.keys(m.patient).length > 0) {
          const p = m.patient;
          html += `<div class="bmp-patient">`;
          html += `<span class="label">Patient</span> `;
          html += `<span class="value">${esc([p.title, p.givenName, p.familyName].filter(Boolean).join(' '))}</span>`;
          if (p.birthDate) html += ` <span style="color:#888">(${esc(p.birthDate)})</span>`;
          html += `</div>`;
        }

        // Author/physician
        if (m.author && m.author.name) {
          html += `<div style="font-size:0.8rem;color:#888;margin:0.3rem 0">Arzt: ${esc(m.author.name)}`;
          if (m.author.date) html += ` &middot; ${esc(m.author.date)}`;
          html += `</div>`;
        }

        // Medication sections
        if (m.sections && m.sections.length > 0) {
          for (const section of m.sections) {
            html += `<div class="bmp-section">`;
            if (section.title) {
              html += `<div class="bmp-section-title">${esc(section.title)}</div>`;
            }
            for (const med of (section.medications || [])) {
              html += `<div class="bmp-med">`;
              html += `<div>`;
              html += `<div class="bmp-med-name">${esc(med.name || 'Unknown')}</div>`;
              if (med.form || med.formText) {
                html += `<div class="bmp-med-form">${esc(med.formText || med.form || '')}</div>`;
              }
              if (med.reason) {
                html += `<div class="bmp-med-reason">${esc(med.reason)}</div>`;
              }
              if (med.instructions) {
                html += `<div style="font-size:0.8rem;color:#666">${esc(med.instructions)}</div>`;
              }
              html += `</div>`;
              // Dosage grid: morning / midday / evening / night
              html += `<div class="bmp-dosage">`;
              const doses = [
                ['Mo', med.dosageMorning],
                ['Mi', med.dosageMidday],
                ['Ab', med.dosageEvening],
                ['Na', med.dosageNight],
              ];
              for (const [label, val] of doses) {
                const active = val && val !== '0';
                html += `<div class="bmp-dose${active ? ' active' : ''}">`;
                html += `<span class="bmp-dose-label">${esc(label)}</span>`;
                html += esc(val || '-');
                html += `</div>`;
              }
              html += `</div>`;
              html += `</div>`;
            }
            html += `</div>`;
          }
        }

        // Observations
        if (m.observations && m.observations.length > 0) {
          html += `<div class="bmp-section"><div class="bmp-section-title">Klinische Parameter</div>`;
          for (const obs of m.observations) {
            html += `<div style="font-size:0.85rem">${esc(obs.parameter || '')}: ${esc(obs.value || '')} ${esc(obs.unit || '')}</div>`;
          }
          html += `</div>`;
        }

        card.innerHTML = html;
        resultsEl.prepend(card);
        return;
      }

      // Standard barcode render (GS1, NDC, etc.)
      const card = document.createElement('div');
      card.className = `scan-card ${found ? 'found' : 'not-found'}`;

      let detailsHtml = '';
      if (found) {
        const fields = [
          m.manufacturer && ['Manufacturer', m.manufacturer],
          m.ndc && ['NDC', m.ndc],
          m.form && ['Form', m.form],
          m.strength && ['Strength', m.strength],
          m.gtin && ['GTIN', m.gtin],
          m.expiry && ['Expiry', m.expiry],
          m.lot && ['Lot', m.lot],
          m.serial && ['Serial', m.serial],
        ].filter(Boolean);

        detailsHtml = `<div class="details">${fields.map(([label, value]) =>
          `<div class="detail"><label>${esc(label)}</label><span>${esc(String(value))}</span></div>`
        ).join('')}</div>`;
      }

      card.innerHTML = `
        <div class="time">${esc(time)} &middot; ${esc(msg.format || 'unknown format')}</div>
        <div class="medicine-name">${found ? esc(m.name || 'GS1 Medicine Data') : 'Unknown Barcode'}</div>
        <div class="barcode-raw">${esc(msg.barcode.length > 100 ? msg.barcode.slice(0, 100) + '...' : msg.barcode)}</div>
        ${detailsHtml}
        ${!found ? `<p style="color:#888;font-size:0.85rem;margin-top:0.5rem">${esc(m.message || '')}</p>` : ''}
      `;

      resultsEl.prepend(card);
    }

    init();
  </script>
</body>
</html>
